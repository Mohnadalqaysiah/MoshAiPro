version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: moshapi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-moshuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moshpass}
      POSTGRES_DB: ${DB_NAME:-moshaiprodb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moshnet

  redis:
    image: redis:7-alpine
    container_name: moshapi_redis
    restart: always
    networks:
      - moshnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moshapi_backend
    restart: always
    env_file:
      - ./backend/.env.prod
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-moshuser}:${DB_PASSWORD:-moshpass}@postgres:5432/${DB_NAME:-moshaiprodb}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - moshnet
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: moshapi_frontend
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - moshnet

  telegram_bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: moshapi_telegram
    restart: always
    environment:
      - API_URL=http://backend:8000
      - FRONTEND_URL=https://qaffel.com
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      - backend
    networks:
      - moshnet
    command: python bot.py

  nginx:
    image: nginx:alpine
    container_name: moshapi_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - moshnet

volumes:
  postgres_data:

networks:
  moshnet:
    driver: bridge
