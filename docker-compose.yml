services:
  postgres:
    image: postgres:15-alpine
    container_name: moshapi_postgres
    environment:
      POSTGRES_USER: moshuser
      POSTGRES_PASSWORD: moshpass
      POSTGRES_DB: moshaiprodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moshnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: moshapi_redis
    networks:
      - moshnet
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moshapi_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://moshuser:moshpass@postgres:5432/moshaiprodb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - moshnet
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.qaffel.com
    container_name: moshapi_frontend
    ports:
      - "8080:80"
    networks:
      - moshnet
    restart: unless-stopped

  telegram_bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: moshapi_telegram
    environment:
      - API_URL=http://backend:8000
      - TELEGRAM_BOT_TOKEN=8089400007:AAE1oQ5QoSn8aeYydeqeSrH7orEiadcnC8M
      - BOT_SECRET=mosh-bot-secret-2026
      - FRONTEND_URL=https://qaffel.com
    depends_on:
      - backend
    volumes:
      - ./telegram-bot:/app
    networks:
      - moshnet
    restart: unless-stopped
    command: python bot.py

volumes:
  postgres_data:

networks:
  moshnet:
    driver: bridge
