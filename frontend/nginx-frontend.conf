server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # (2026-10-17) ضغط — فحص السرعة: JS يُرسل بلا ضغط (index 232KB بدل ~74KB، three 668KB بدل ~176KB) لكل الموقع.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/javascript: nginx الحديث يسمّي .js هكذا (لا application/javascript) — بدونه بقي JS بلا ضغط بعد التفعيل الأول
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # (2026-09-04) index.html نفسه بدون تخزين مؤقت طويل عمداً — لازم
    # يوصل حديث دايماً، وإلا متصفح بيخزّن نسخة قديمة بتشاور لملفات
    # JS/CSS محذوفة (أسماء Vite متغيّرة بـhash) بعد أي نشر جديد.
    #
    # (2026-10-04) `$uri.html` لخدمة HTML المُولَّد وقت البناء للمقالات
    # (scripts/prerender-blog.mjs). شُلت `$uri/` عمداً: وجود مجلد dist/blog/
    # كان سيجعل `/blog` يطابق المجلد ويرجّع 403 بدل صفحة الـSPA.
    # (2026-10-17) ملف بيانات غير موجود (json/txt/xml/md) = 404 حقيقي، لا صفحة الـSPA بحالة 200.
    # كان /ai-catalog.json وغيره يرجّع HTML فيفشل فحص Lighthouse (Agentic) — ويُعدّ soft-404 عند الزواحف.
    location ~* \.(json|txt|xml|md)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html /index.html;
        add_header Cache-Control "no-cache";
    }

    # webp/avif كانوا ناقصين — Lighthouse رصد /brand/logo-icon-only.avif
    # بدون أي Cache-Control (TTL=None) لأنه كان يقع بالـlocation / الافتراضي
    # بدل هالبلوك، ما يتحقق منه أي تخزين مؤقت طويل.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
