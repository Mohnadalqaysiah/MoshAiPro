server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # (2026-09-04) index.html نفسه بدون تخزين مؤقت طويل عمداً — لازم
    # يوصل حديث دايماً، وإلا متصفح بيخزّن نسخة قديمة بتشاور لملفات
    # JS/CSS محذوفة (أسماء Vite متغيّرة بـhash) بعد أي نشر جديد.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # webp/avif كانوا ناقصين — Lighthouse رصد /brand/logo-icon-only.avif
    # بدون أي Cache-Control (TTL=None) لأنه كان يقع بالـlocation / الافتراضي
    # بدل هالبلوك، ما يتحقق منه أي تخزين مؤقت طويل.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
